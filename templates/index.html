<!-- templates/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Simple Online Shop</title>
</head>
<body>
    <h1>My Online Shop</h1>
    
    <h2>Current Order State: <span id="order-state">{{ order.state }}</span></h2>
    
    <h3>Items in Cart: {{ order.items|length }}</h3>
    <h3>Total (with shipping): $<span id="order-total">{{ total }}</span></h3>

    {% if order.state == "cart" %}
    <form action="/add" method="POST">
        <label>Item Price ($): </label>
        <input type="number" id="price-input" name="price" step="0.01" min="0" required>
        <button type="submit" id="add-btn">Add to Cart</button>
    </form>
    <br>
    <form action="/checkout" method="POST">
        <button type="submit" id="checkout-btn">Checkout</button>
    </form>
    {% else %}
    <p>Thank you for your order! It is currently: {{ order.state }}</p>
    {% endif %}
</body>
</html>
